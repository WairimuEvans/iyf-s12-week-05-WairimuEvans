<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="todo-app">
        <h1>My To-Do List</h1>

        <form id="todo-form">
            <label class="visually-hidden" for="todo-input">New task</label>
            <input id="todo-input" type="text" placeholder="What needs to be done?" autocomplete="off">
            <button type="submit">Add Task</button>
        </form>

        <nav class="filters" aria-label="Task filters">
            <button type="button" class="filter active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button>
        </nav>

        <ul id="todo-list" aria-live="polite"></ul>

        <footer class="todo-footer">
            <span id="items-left">0 items left</span>
            <button id="clear-completed" type="button">Clear Completed</button>
        </footer>
    </main>
    <script src="app.js"></script>
</body>
</html>
