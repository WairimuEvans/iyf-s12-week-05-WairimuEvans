<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Content Copier</title>
</head>
<body>
    <main>
        <h1>Content Copier</h1>
        <section>
            <h2>Original content</h2>
            <p id="source-content">This is the original paragraph that will be copied.</p>
        </section>
        <section>
            <h2>Copied content</h2>
            <p id="target-content">The copied paragraph will appear here.</p>
        </section>
        <button id="copy-content" type="button">Copy Content</button>
        <p id="copy-status" role="status" aria-live="polite"></p>
    </main>
    <script src="day-4-content-copier.js"></script>
</body>
</html>
